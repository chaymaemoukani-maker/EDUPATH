services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edupath-app
    container_name: edupath-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - edupath-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: edupath-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - edupath-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: edupath-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-edupath}
      MYSQL_USER: ${DB_USERNAME:-edupath_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-edupath_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - edupath-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edupath-network:
    driver: bridge

volumes:
  db_data:
    driver: local
