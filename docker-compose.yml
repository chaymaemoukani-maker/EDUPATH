services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: edupath-app
    container_name: edupath-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment: &app_env
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GROQ_TIMEOUT: ${GROQ_TIMEOUT:-30}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_LOCALE: ${APP_LOCALE:-en}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-edupath}
      DB_USERNAME: ${DB_USERNAME:-edupath_user}
      DB_PASSWORD: ${DB_PASSWORD:-edupath_password}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    networks:
      - edupath-network
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - edupath_build:/var/www/html/public/build
    healthcheck:
      test: ["CMD", "php", "artisan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: edupath-web
    container_name: edupath-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:80"
    networks:
      - edupath-network
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - edupath_build:/var/www/html/public/build
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  queue:
    image: edupath-app
    container_name: edupath-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work database --tries=3
    environment:
      <<: *app_env
    networks:
      - edupath-network
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: edupath-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-edupath}
      MYSQL_USER: ${DB_USERNAME:-edupath_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-edupath_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - edupath-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  edupath-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  edupath_build:
    driver: local
